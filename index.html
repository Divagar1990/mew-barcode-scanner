
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEW Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:white;font-family:Arial,sans-serif}
.container{max-width:500px;margin:25px auto;background:#1e293b;padding:22px;border-radius:16px}
h2{text-align:center;color:#38bdf8}
p{text-align:center;color:#cbd5e1}
#reader{width:100%;margin:20px auto}
input{width:100%;padding:14px;border-radius:8px;border:1px solid #475569;font-size:17px;margin:10px 0}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#0284c7;color:white;font-size:16px;font-weight:bold;margin:7px 0;cursor:pointer}
button.stop{background:#dc2626}
#status{padding:12px;text-align:center;color:#facc15;overflow-wrap:anywhere}
#result{color:#4ade80;font-size:18px;text-align:center;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h2>MEW STORE INVENTORY</h2>
<p>Barcode Scanner</p>
<div id="reader"></div>
<div id="status">Ready to scan</div>
<div id="result"></div>
<input id="manualBarcode" placeholder="Enter barcode manually">
<button onclick="startScanner()">START CAMERA SCAN</button>
<button class="stop" onclick="stopScanner()">STOP CAMERA</button>
<button onclick="sendManual()">SEND BARCODE</button>
</div>

<script>
let scanner=null,busy=false;

function getParams(){
  const p=new URLSearchParams(location.search);
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  return {
    sid:p.get('sid')||'',
    secret:p.get('secret')||'',
    relay:p.get('relay')||'',
    nonce:h.get('nonce')||p.get('nonce')||''
  };
}

function normalizeBarcode(value){
  return String(value||'').trim().replace(/^\*(.*?)\*$/,'$1').trim();
}

function setStatus(t){
  document.getElementById('status').textContent=t;
}

function sendBarcode(value){
  const barcode=normalizeBarcode(value);
  if(!barcode)return;

  document.getElementById('manualBarcode').value=barcode;
  document.getElementById('result').textContent='Scanned: '+barcode;

  const cfg=getParams();

  // NEW: Send directly to the inventory page on the same phone
  if(cfg.nonce){
    if(!window.opener||window.opener.closed){
      setStatus('Inventory connection not found. Return to the inventory app and tap Scan on This Phone again.');
      return;
    }

    try{
      window.opener.postMessage({
        type:'MEW_BARCODE_SCANNED',
        barcode:barcode,
        nonce:cfg.nonce
      },'*');

      setStatus('Barcode sent to inventory on this phone. Check the inventory tab.');
      stopScanner();
      return;
    }catch(e){
      setStatus('Could not send barcode: '+(e.message||e));
      return;
    }
  }

  // OLD: Keep laptop QR scanner support
  if(!cfg.sid||!cfg.secret||!cfg.relay){
    setStatus('No inventory connection found. Open Scan on This Phone from the inventory app.');
    stopScanner();
    return;
  }

  setStatus('Sending barcode to MEW laptop...');

  fetch(cfg.relay,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=UTF-8'},
    body:JSON.stringify({
      sid:cfg.sid,
      secret:cfg.secret,
      barcode:barcode
    })
  })
  .then(()=>{
    setStatus('Barcode sent. Check MEW laptop.');
    stopScanner();
  })
  .catch(()=>{
    setStatus('Network error. Please check internet.');
  });
}

async function startScanner(){
  if(busy)return;

  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setStatus('Camera access unavailable. Use HTTPS in a supported browser.');
    return;
  }

  if(!window.Html5Qrcode){
    setStatus('Scanner library could not load. Check internet.');
    return;
  }

  try{
    busy=true;
    setStatus('Starting camera. Please allow camera access...');

    scanner=new Html5Qrcode('reader');

    const formats=[
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:280,height:150},formatsToSupport:formats},
      decoded=>{
        if(!busy)return;
        busy=false;
        sendBarcode(decoded);
      },
      ()=>{}
    );

    setStatus('Camera active. Point it at the barcode.');
  }catch(e){
    busy=false;
    setStatus('Camera error: '+(e.message||e));
    await stopScanner();
  }
}

async function stopScanner(){
  const current=scanner;
  scanner=null;
  busy=false;

  if(current){
    try{
      if(current.isScanning)await current.stop();
    }catch(e){}
    try{current.clear();}catch(e){}
  }
}

function sendManual(){
  sendBarcode(document.getElementById('manualBarcode').value);
}

window.addEventListener('beforeunload',()=>stopScanner());
</script>
</body>
</html>
