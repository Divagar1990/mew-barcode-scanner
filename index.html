
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEW Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:white;font-family:Arial,sans-serif}
.container{max-width:500px;margin:25px auto;background:#1e293b;padding:22px;border-radius:16px}
h2{text-align:center;color:#38bdf8}
p{text-align:center;color:#cbd5e1}
#reader{width:100%;margin:20px auto}
input{width:100%;padding:14px;border-radius:8px;border:1px solid #475569;font-size:17px;margin:10px 0}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#0284c7;color:white;font-size:16px;font-weight:bold;margin:7px 0;cursor:pointer}
button.stop{background:#dc2626}
#status{padding:12px;text-align:center;color:#facc15;overflow-wrap:anywhere}
#result{color:#4ade80;font-size:18px;text-align:center;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h2>MEW STORE INVENTORY</h2>
<p>Barcode Scanner</p>

<div id="reader"></div>

<div id="status">Ready to scan</div>
<div id="result"></div>

<input id="manualBarcode" placeholder="Enter barcode manually">

<button onclick="startScanner()">START CAMERA SCAN</button>
<button class="stop" onclick="stopScanner()">STOP CAMERA</button>
<button onclick="sendManual()">SEND BARCODE</button>
</div>

<script>
let scanner = null;
let busy = false;

function getNonce(){
  const match = location.hash.match(/nonce=([^&]+)/);
  return match ? decodeURIComponent(match[1]) : '';
}

function setStatus(message){
  document.getElementById('status').textContent = message;
}

function sendBarcode(value){
  const barcode = String(value || '').trim();
  if(!barcode) return;

  document.getElementById('manualBarcode').value = barcode;
  document.getElementById('result').textContent = 'Scanned: ' + barcode;
  setStatus('Barcode captured. Returning to MEW app...');

  const nonce = getNonce();

  if(window.opener && !window.opener.closed && nonce){
    window.opener.postMessage({
      type:'MEW_BARCODE_SCANNED',
      barcode:barcode,
      nonce:nonce
    }, '*');

    setStatus('Barcode sent. You can return to the MEW app.');
  }else{
    setStatus('Barcode ready. Copy it and enter it in the MEW app.');
  }

  stopScanner();
}

async function startScanner(){
  if(busy) return;

  if(!window.isSecureContext){
    setStatus('Please open this scanner using HTTPS.');
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('Camera is not available in this browser.');
    return;
  }

  if(!window.Html5Qrcode){
    setStatus('Scanner library could not load. Check internet.');
    return;
  }

  try{
    busy = true;
    setStatus('Starting camera. Please allow camera access...');

    scanner = new Html5Qrcode('reader');

    const formats = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:10,
        qrbox:{width:280,height:150},
        formatsToSupport:formats
      },
      decodedText => {
        if(!busy) return;
        busy = false;
        sendBarcode(decodedText);
      },
      () => {}
    );

    setStatus('Camera active. Point at the barcode.');
  }catch(error){
    busy = false;
    setStatus('Camera error: ' + (error.message || error));
    await stopScanner();
  }
}

async function stopScanner(){
  const current = scanner;
  scanner = null;
  busy = false;

  if(current){
    try{
      if(current.isScanning) await current.stop();
    }catch(e){}
    try{current.clear();}catch(e){}
  }
}

function sendManual(){
  sendBarcode(document.getElementById('manualBarcode').value);
}

window.addEventListener('beforeunload', stopScanner);
</script>
</body>
</html>
